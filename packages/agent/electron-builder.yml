appId: com.mycamerascontroller.agent
productName: MyCamerasController-Agent
electronVersion: 32.3.3
directories:
  output: release
  # dist/ carries its own minimal, dependency-free package.json (written by
  # build.mjs) — electron-builder packages from there, not from this
  # workspace package's own package.json. See build.mjs for why.
  app: dist

# Windows: 'portable' produces a single self-contained exe with no install
# wizard and no UAC elevation prompt — download and run.
win:
  target:
    - target: portable
      arch: [x64]

# Linux: AppImage is a single executable file — no package manager, no root.
# The user makes it executable themselves (chmod +x, or "Allow executing as
# program" in the file manager) and runs it directly.
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# type 2 AppImage runtime; also handles systems without FUSE via
# --appimage-extract-and-run, which the app falls back to itself (see main.ts).
appImage:
  artifactName: ${productName}-${version}.${ext}
